{% extends "v2/base.html" %}{% block content %}<section class="login-card glass"><p class="eyebrow">アカウント保護</p><h1>自分専用のパスワードへ変更</h1><p class="lead">初期パスワードはそのまま使えません。12文字以上で設定してください。</p>{% for message in get_flashed_messages() %}<div class="notice">{{ message }}</div>{% endfor %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>新しいパスワード<input type="password" name="password" minlength="12" required autocomplete="new-password"></label><label>もう一度入力<input type="password" name="confirmation" minlength="12" required autocomplete="new-password"></label><button class="primary">変更して続ける</button></form></section>{% endblock %}
