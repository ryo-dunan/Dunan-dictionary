{% extends "v2/base.html" %}{% block content %}<header class="topbar glass"><div><p class="eyebrow">出典情報</p><h1>{{ record.name }}</h1></div><a class="quiet link-button" href="{{ url_for('sources.entry_sources',entry_id=record.entry_id) }}">出典一覧へ戻る</a></header>{% for message in get_flashed_messages() %}<div class="notice page-notice">{{ message }}</div>{% endfor %}<section class="form-card glass"><p class="help">この変更は、この資料の情報だけに反映されます。他の項目や別資料の情報は変更されません。</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field-grid"><label>その資料での見出し語<input name="source_headword" value="{{ record.source_headword or '' }}"></label><label>ページ・項目番号<input name="locator" value="{{ record.locator or '' }}"></label></div><label>その資料における意味・説明<textarea name="source_description" rows="4">{{ record.source_description or '' }}</textarea></label><label>資料間の相違・編集上の整理<textarea name="adopted_interpretation" rows="4">{{ record.adopted_interpretation or '' }}</textarea></label><label>その他の注記<textarea name="note" rows="3">{{ record.note or '' }}</textarea></label><button class="primary">この出典情報を更新</button></form></section>{% endblock %}
