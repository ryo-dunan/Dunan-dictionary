{% extends "v2/base.html" %}
{% block title %}ログイン | どぅなんむぬい辞典{% endblock %}
{% block content %}
<section class="login-card glass">
  <p class="eyebrow">編集チーム専用</p>
  <h1>どぅなんむぬい辞典</h1>
  <p class="lead">ご自分のアカウントでログインしてください。</p>
  {% for message in get_flashed_messages() %}<div class="notice" role="alert">{{ message }}</div>{% endfor %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>ユーザー名<input name="username" required autocomplete="username"></label>
    <label>パスワード<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="primary" type="submit">ログイン</button>
  </form>
</section>
{% endblock %}
