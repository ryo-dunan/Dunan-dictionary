{% extends "v2/base.html" %}{% block content %}<header class="topbar glass"><div><p class="eyebrow">資料・典拠</p><h1>{{ source.name }}を編集</h1></div><a class="quiet link-button" href="{{ url_for('sources.index') }}">資料一覧へ戻る</a></header>{% for message in get_flashed_messages() %}<div class="notice page-notice">{{ message }}</div>{% endfor %}<section class="form-card glass"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field-grid"><label>資料名<input name="name" required value="{{ source.name }}"></label><label>略称<input name="abbreviation" value="{{ source.abbreviation or '' }}"></label><label>資料種別<input name="source_type" value="{{ source.source_type or '' }}"></label><label>URL<input type="url" name="url" value="{{ source.url or '' }}"></label></div><label>完全な書誌情報<textarea name="bibliography" required rows="4">{{ source.bibliography }}</textarea></label><label>公開中の見出し語画面での扱い<select name="show_on_public"><option value="1"{% if source.show_on_public %} selected{% endif %}>出典名・書誌情報を表示する（他社の辞典・書籍など）</option><option value="0"{% if not source.show_on_public %} selected{% endif %}>出典名は表示しない（町の例会・内部的なデータ区分）</option></select></label><p class="help">非表示にしても内容は公開され、管理画面とDBではこの資料のデータとして分離されたままです。</p><button class="primary">更新</button></form></section>{% endblock %}
