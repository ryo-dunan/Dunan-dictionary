<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087e82">
  <meta name="description" content="{{ ui.meta_description }}">
  <title>{% block title %}どぅなんむぬい辞典{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static',filename='public/manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/dictionary.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/images.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/source-credit.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/dictionary-sections.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/conjugation-tables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/i18n.css') }}">
  <link rel="stylesheet" href="{{ url_for('static',filename='public/about.css') }}">
</head>
<body>
  <div class="island-bg" aria-hidden="true"></div>
  <header class="public-nav">
    <a class="brand" href="{{ url_for('public.index',language=language) }}"><span>𓇼</span><strong>どぅなんむぬい辞典</strong><small>{{ ui.brand_subtitle }}</small></a>
    <nav aria-label="{{ ui.language_nav }}">
      <a href="{{ language_urls.ja }}" {% if language=='ja' %}aria-current="page"{% endif %}>日本語</a>
      <a href="{{ language_urls.yonaguni }}" {% if language=='yonaguni' %}aria-current="page"{% endif %}>どぅなんむぬい</a>
      <a href="{{ language_urls.en }}" {% if language=='en' %}aria-current="page"{% endif %}>English</a>
      <a href="{{ language_urls['zh-tw'] }}" {% if language=='zh-tw' %}aria-current="page"{% endif %}>繁體中文</a>
    </nav>
  </header>
  <main class="public-shell">{% block content %}{% endblock %}</main>
  <footer>
    {{ ui.footer }}<br>
    <small class="site-credit">© 与那国町教育委員会　制作：梁為棟（<span lang="en">Weidong Liang</span>）・ヘルシンキ大学 <span class="footer-divider" aria-hidden="true">｜</span> <a class="footer-about-link" href="{{ url_for('public.about',language=language) }}">{{ ui.about }}</a></small>
  </footer>
  <script src="{{ url_for('static',filename='public/register-sw.js') }}" defer></script>
</body>
</html>
